<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禪宗祖師尋蹤 - 傳承千載法脈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #fdfbf7;
            --ink-black: #2d2d2d;
            --zen-gold: #8b7355;
        }
        body {
            background-color: var(--bg-paper);
            color: var(--ink-black);
            font-family: 'Noto Serif TC', serif;
            scroll-behavior: smooth;
        }
        .story-font { font-family: 'Noto Sans TC', sans-serif; font-weight: 300; letter-spacing: 0.02em; }
        .quote-font { font-family: 'Zen Maru Gothic', sans-serif; font-style: normal; font-weight: 500; letter-spacing: 0.05em; }
        .zen-card { background: #ffffff; border: 1px solid rgba(139, 115, 85, 0.1); border-radius: 2rem; box-shadow: 0 10px 40px rgba(139, 115, 85, 0.05); }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .loading-spin { border: 3px solid rgba(139, 115, 85, 0.1); border-top: 3px solid var(--zen-gold); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 md:p-12">

    <header class="text-center mb-16 mt-8 fade-in">
        <h1 class="text-5xl md:text-7xl font-bold mb-8 tracking-[0.4em] text-[#8b7355]">禪宗祖師尋蹤</h1>
        <p class="text-xl md:text-2xl opacity-60 tracking-[0.6em] font-light">法脈相承 · 直指人心 · 見性成佛</p>
    </header>

    <section class="w-full max-w-3xl mb-20 fade-in">
        <form id="searchForm" class="relative flex items-center">
            <input id="searchInput" type="text" placeholder="輸入祖師名號..." class="w-full p-8 text-2xl rounded-3xl outline-none border-2 border-stone-100 focus:border-[#8b7355] text-center shadow-sm" />
            <button type="submit" class="absolute right-6 px-8 py-4 rounded-2xl text-white font-bold bg-[#8b7355] hover:bg-[#6d5a43] transition-all">探尋</button>
        </form>
        <div class="mt-8 flex flex-wrap justify-center gap-4">
            <button onclick="quickSearch('達摩')" class="px-4 py-2 rounded-full border border-stone-200 text-stone-500 hover:border-[#8b7355]">達摩</button>
            <button onclick="quickSearch('慧能')" class="px-4 py-2 rounded-full border border-stone-200 text-stone-500 hover:border-[#8b7355]">慧能</button>
            <button onclick="quickSearch('趙州')" class="px-4 py-2 rounded-full border border-stone-200 text-stone-500 hover:border-[#8b7355]">趙州</button>
        </div>
    </section>

    <div id="loader" class="hidden flex flex-col items-center gap-4 my-20">
        <div class="loading-spin"></div>
        <p class="text-stone-400 tracking-widest">正在從雲端法海調閱資料...</p>
    </div>

    <main id="resultArea" class="hidden w-full max-w-5xl space-y-12 pb-40 fade-in">
        <div class="zen-card p-10 md:p-20 text-center">
            <p class="text-stone-300 text-xs tracking-widest mb-6 uppercase">Master Lineage</p>
            <div id="masterTeacher" class="text-2xl text-[#8b7355] mb-8"></div>
            <div class="h-12 w-px bg-stone-100 mx-auto mb-8"></div>
            <div id="masterName" class="text-5xl md:text-7xl font-bold text-white bg-[#8b7355] inline-block px-16 py-8 rounded-[3rem] shadow-xl"></div>
            <div class="h-12 w-px bg-stone-100 mx-auto mt-8 mb-8"></div>
            <div id="masterDisciples" class="flex flex-wrap justify-center gap-4"></div>
            <p class="mt-8 text-stone-300 text-sm">※ 若法嗣弟子眾多，僅以部份呈現。未完備處請至佛學規範資料庫詳閱。</p>
        </div>

        <div class="zen-card p-10 md:p-20">
            <div class="bg-stone-50 p-12 rounded-[3rem] mb-16 text-center">
                <p id="masterSummary" class="quote-font text-3xl md:text-5xl text-[#8b7355] leading-relaxed"></p>
            </div>
            <article id="masterStory" class="story-font text-2xl md:text-3xl leading-[2.2] text-stone-700 text-justify space-y-8 indent-12"></article>
        </div>
    </main>

    <script>
        // --- 重要：在此貼入您的 GAS 網頁應用程式 URL ---
        const gasUrl = "https://script.google.com/macros/s/AKfycbz_dt2Yz2_GWL7T6Ll_-hZR3RGjl6HotKRfNmfLmEwFTfnUkDFd9RAgwIqOkud9Z8M1/exec"; 

        async function fetchZenMaster(name) {
            if (!name || gasUrl === "https://script.google.com/macros/s/AKfycbz_dt2Yz2_GWL7T6Ll_-hZR3RGjl6HotKRfNmfLmEwFTfnUkDFd9RAgwIqOkud9Z8M1/exec") {
                alert("請先完成 GAS 部署並在程式碼中填入網址。");
                return;
            }
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');

            try {
                const response = await fetch(`${https://script.google.com/macros/s/AKfycbz_dt2Yz2_GWL7T6Ll_-hZR3RGjl6HotKRfNmfLmEwFTfnUkDFd9RAgwIqOkud9Z8M1/exec}?name=${encodeURIComponent(name)}`);
                const data = await response.json();
                const master = JSON.parse(data.candidates[0].content.parts[0].text);
                
                render(master);
            } catch (err) {
                alert("搜尋失敗，請檢查 GAS 部署是否正確設定為「所有人」存取。");
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function render(m) {
            document.getElementById('masterName').textContent = m.name;
            document.getElementById('masterTeacher').textContent = m.teacher || "法脈傳承中";
            document.getElementById('masterSummary').textContent = `「 ${m.summary} 」`;
            const dContainer = document.getElementById('masterDisciples');
            dContainer.innerHTML = (m.disciples || []).map(d => `<span class="px-6 py-2 border border-stone-100 rounded-full text-stone-500">${d}</span>`).join('');
            document.getElementById('masterStory').innerHTML = m.story.split('\n').map(p => `<p>${p}</p>`).join('');
            document.getElementById('resultArea').classList.remove('hidden');
            window.scrollTo({ top: document.getElementById('resultArea').offsetTop - 50, behavior: 'smooth' });
        }

        function quickSearch(n) { document.getElementById('searchInput').value = n; fetchZenMaster(n); }
        document.getElementById('searchForm').addEventListener('submit', (e) => { e.preventDefault(); fetchZenMaster(document.getElementById('searchInput').value); });
    </script>
</body>
</html>
